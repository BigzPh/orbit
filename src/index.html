<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit - Antigravity Mini Sidebar</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="drag-bar" data-tauri-drag-region>
      <div class="drag-title">Orbit</div>
      <div class="badge">Always on Top</div>
    </div>

    <main class="container">
      <div class="logo-wrap">
        <img src="/assets/logo.png" class="orbit-icon" alt="Orbit Logo" />
      </div>

      <h1>Orbit</h1>
      <p class="tagline">Antigravity Mini Sidebar</p>

      <div class="card status-card">
        <div class="status-header">
          <span class="status-dot"></span>
          <span>Remote Control Ready</span>
        </div>
        <p class="desc">Connecting you to your Antigravity Agent workstation...</p>
        <button id="connect-btn" class="primary-btn">
          Open Antigravity Remote
        </button>
      </div>

      <div class="card shortcuts-card">
        <h3>Quick Controls</h3>
        <ul class="shortcuts-list">
          <li><kbd>⌥ Space</kbd> <span>Toggle Sidebar</span></li>
          <li><kbd>⌘ R</kbd> <span>Reload Stream</span></li>
          <li><span>Menu Bar Icon</span> <span>Pin & Dock Controls</span></li>
        </ul>
      </div>

      <div class="custom-url-box">
        <label for="url-input">Custom Host (e.g. Local CLI bridge)</label>
        <div class="input-row">
          <input id="url-input" placeholder="https://antigravity.google.com" value="https://antigravity.google.com" />
          <button id="go-btn" class="secondary-btn">Go</button>
        </div>
      </div>
    </main>
  </body>
</html>
